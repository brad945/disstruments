# Source-label -> taxonomy-node mappings (companion to taxonomy.yaml).
#
# Kept separate from the tree: the tree is the stable, semver'd label-space contract that
# reports reference; mappings change whenever a dataset is added or a call is revised.
# Eval reports record the sha256 of BOTH files.
#
# Entry grammar (`map` tables):
#   label: node.id                      positive at node.id
#   label: [node.a, node.b]             positive at several nodes
#   label: {node: node.id | [..],       long form
#           children_unknown: bool,     default true for internal nodes: the source is
#                                       coarser than our leaves, so descendants become
#                                       UNKNOWN (masked), not negative. false = "present at
#                                       this node but none of our children" (known negative)
#           unknown: [node | "*"]}      extra subtrees to mark unknown ("*" = everything)
# `ignore` tables: label: {reason: str, unknown: [...], stem_unknown: [...]}
#   unknown defaults to []; `stem_unknown` masks only the stem carrying the label, not the
#   track (e.g. a room mic whose content is labeled on the other stems).
# `unobserved` (per dataset): {node: reason} subtrees that are UNOBSERVED on every record
#   and every stem of that dataset. A pure observation mask: it never strips a positive.
#   Validated at load (datasets/base.py `unobserved_roots`, every section incl. openmic):
#   roots must be level-1 nodes (a deeper root would leave its ancestors observed only
#   when positive = label-dependent missingness), and no rule of that dataset may name a
#   node inside an unobserved subtree (use an `ignore` entry for such source labels).
#   Under those two rules the mask is label-independent.
# Unknown subtrees also make their ancestors unknown (unless positive); positives always
# win over unknown. Labels absent from both tables are surfaced by the loaders (strict
# mode raises with the full list; non-strict records them and masks everything).
taxonomy_version: 3.0.0

# ------------------------------------------------------------------------ OpenMIC-2018
# Total map: all 20 classes, each to exactly one node; no mapped node is an ancestor of
# another (antichain), so node -> OpenMIC projection is unique. Verified by tests.
# `piano` -> keys.piano (acoustic, v3): OpenMIC "piano" clips may include electric pianos
# (label-noise confound); keys.electric_piano does NOT project to OpenMIC `piano`.
# `saxophone` -> woodwinds.saxophone (internal in v3): positives leave the subtype unknown.
openmic:
  binarize_threshold: 0.5        # Y_true >= 0.5, as in the official baseline notebook
  classes:
    accordion: keys.accordion
    banjo: strings.plucked.banjo
    bass: bass
    cello: strings.bowed.cello
    clarinet: woodwinds.clarinet
    cymbals: cymbals
    drums: drums
    flute: woodwinds.flute
    guitar: guitar
    mallet_percussion: percussion.mallet
    mandolin: strings.plucked.mandolin
    organ: keys.organ
    piano: keys.piano
    saxophone: woodwinds.saxophone
    synthesizer: keys.synth
    trombone: brass.trombone
    trumpet: brass.trumpet
    ukulele: strings.plucked.ukulele
    violin: strings.bowed.violin
    voice: voice

# ------------------------------------------------------------------------ MedleyDB 1+2
# Vocabulary = marl/medleydb resources/taxonomy.yaml + labels observed in the real
# metadata but missing from that file ("woodwind section"). Applied to stem AND raw-track
# instrument fields (both may be a string or a list). Raw-track labels may only REFINE the
# stem: a raw label counts as positive only if it resolves to a descendant-or-self of a
# node the stem's own label maps to (vocalists -> male singer, auxiliary percussion ->
# tambourine). Otherwise (distorted stem + clean DI raw, string section + cello raw, drum
# machine + kick raw) the raw's nodes are marked UNKNOWN, never positive.
medleydb:
  artist_aliases:                   # applied after normalization (casefold, quotes)
    "music delta multitracks": "music delta"
  unobserved:
    # Bradley 2026-09-28: cymbals are scored only on OpenMIC. MedleyDB labels cymbals only
    # when separately mic'd (usually they sit inside "drum set"), so neither "kit implies
    # cymbals" (v2) nor "absent = negative" is honest. "high hat"/"cymbal" are ignore
    # entries (nothing may map inside an unobserved subtree).
    cymbals: "scored only on OpenMIC (taxonomy 3.0.0)"
  map:
    # strings / bowed
    erhu: {node: strings.bowed, children_unknown: false}
    dilruba: {node: strings.bowed, children_unknown: false}
    violin: strings.bowed.violin
    viola: strings.bowed.viola
    cello: strings.bowed.cello
    double bass: bass.upright
    violin section: strings.bowed.section
    viola section: strings.bowed.section
    cello section: strings.bowed.section
    string section: strings.bowed.section
    # strings / plucked
    acoustic guitar: guitar.acoustic
    slide guitar: guitar
    banjo: strings.plucked.banjo
    mandolin: strings.plucked.mandolin
    ukulele: strings.plucked.ukulele
    harp: strings.plucked.harp
    sitar: {node: strings.plucked, children_unknown: false}     # sitar leaf collapsed (3.0.0)
    guzheng: {node: strings.plucked, children_unknown: false}
    liuqin: {node: strings.plucked, children_unknown: false}
    oud: {node: strings.plucked, children_unknown: false}
    zhongruan: {node: strings.plucked, children_unknown: false}
    harpsichord: keys.harpsichord
    # strings / struck
    piano: keys.piano
    tack piano: keys.piano
    dulcimer: {node: strings, children_unknown: false}
    yangqin: {node: strings, children_unknown: false}
    # winds / flutes
    flute: woodwinds.flute
    flute section: woodwinds.flute
    piccolo: woodwinds.flute
    bamboo flute: woodwinds.flute
    dizi: woodwinds.flute
    panpipes: {node: woodwinds, children_unknown: false, unknown: [woodwinds.flute]}
    recorder: {node: woodwinds, children_unknown: false, unknown: [woodwinds.flute]}
    # winds / reeds
    alto saxophone: woodwinds.saxophone.alto
    baritone saxophone: woodwinds.saxophone.baritone
    tenor saxophone: woodwinds.saxophone.tenor
    soprano saxophone: woodwinds.saxophone.soprano
    clarinet: woodwinds.clarinet
    bass clarinet: woodwinds.clarinet
    clarinet section: woodwinds.clarinet
    oboe: woodwinds.oboe
    english horn: woodwinds.oboe
    bassoon: woodwinds.bassoon
    bagpipe: {node: woodwinds, children_unknown: false}
    woodwind section: woodwinds
    # winds / brass
    trumpet: brass.trumpet
    cornet: brass.trumpet
    trumpet section: brass.trumpet
    trombone: brass.trombone
    trombone section: brass.trombone
    french horn: brass.french_horn
    french horn section: brass.french_horn
    tuba: brass.tuba
    euphonium: {node: brass, children_unknown: false}
    brass section: brass.section
    horn section: {node: brass.section, unknown: [woodwinds.saxophone]}  # pop "horns" often include sax
    # winds / free reeds
    harmonica: woodwinds.harmonica
    accordion: keys.accordion
    concertina: keys.accordion
    bandoneon: keys.accordion
    harmonium: {node: keys.organ, children_unknown: false}
    pipe organ: keys.organ.pipe
    # voices
    male singer: voice.sung        # male/female leaves removed in taxonomy 2.0.0 (scope)
    female singer: voice.sung
    vocalists: voice.sung
    male rapper: voice.rap
    female rapper: voice.rap
    male speaker: voice.spoken
    female speaker: voice.spoken
    male screamer: voice.screamed
    female screamer: voice.screamed
    choir: voice.choir
    beatboxing: {node: voice, children_unknown: false}          # beatbox leaf collapsed (3.0.0)
    # percussion / idiophones
    gong: {node: percussion, children_unknown: false}
    shaker: percussion.shaker
    maracas: percussion.shaker
    cabasa: percussion.shaker
    rattle: percussion.shaker
    claps: percussion.claps
    glockenspiel: percussion.mallet.glockenspiel
    vibraphone: percussion.mallet.vibraphone
    marimba: percussion.mallet.marimba
    xylophone: percussion.mallet.xylophone
    chimes: {node: percussion, children_unknown: false, unknown: [percussion.mallet]}
    triangle: {node: percussion, children_unknown: false}
    sleigh bells: {node: percussion, children_unknown: false}
    cowbell: {node: percussion, children_unknown: false}
    guiro: {node: percussion, children_unknown: false}
    castanet: {node: percussion, children_unknown: false}
    snaps: {node: percussion, children_unknown: false}
    # percussion / drums
    # 3.0.0: no "kit implies cymbals" (v2 assumption dropped); cymbals is dataset-wide
    # unobserved here (see `unobserved` above).
    drum set: drums.acoustic_kit
    kick drum: drums.acoustic_kit
    bass drum: drums.acoustic_kit
    snare drum: drums.acoustic_kit
    toms: drums.acoustic_kit
    timpani: {node: percussion, children_unknown: false}
    gu: {node: percussion, children_unknown: false}
    tambourine: percussion.tambourine
    bongo: percussion.hand_drums
    conga: percussion.hand_drums
    darbuka: percussion.hand_drums
    doumbek: percussion.hand_drums
    tabla: percussion.hand_drums
    auxiliary percussion: percussion
    # electric / amplified + electronic
    clean electric guitar: guitar.electric.clean
    distorted electric guitar: guitar.electric.distorted
    lap steel guitar: guitar.lap_steel
    electric bass: bass.electric
    drum machine: drums.electronic
    electric piano: keys.electric_piano     # subtype unknown (rhodes/wurlitzer/fm masked)
    electronic organ: keys.organ
    synthesizer: {node: keys.synth, unknown: [bass.synth]}  # synth stems often carry bass lines
  ignore:
    Main System: {reason: "room/PA capture; every instrument in it has its own labeled stem", stem_unknown: ["*"]}
    Unlabeled: {reason: "unknown content", unknown: ["*"]}
    sampler: {reason: "could be any instrument", unknown: ["*"]}
    fx/processed sound: {reason: "processed audio, not an instrument; often synths or treated guitars", unknown: [keys.synth, guitar.electric]}
    scratches: {reason: "turntable scratching; out of taxonomy scope"}
    theremin: {reason: "out of taxonomy scope"}
    melodica: {reason: "out of taxonomy scope; timbrally close to accordion/harmonica", unknown: [keys.accordion, woodwinds.harmonica]}
    whistle: {reason: "out of taxonomy scope"}
    crowd: {reason: "audience noise; may contain singing/speech", unknown: [voice]}
    # 3.0.0: cymbals are unobserved on MedleyDB. A close-mic'd hi-hat/cymbal stem also
    # picks up the kit / nearby percussion, so those are masked on that stem only (not
    # "known absent"); as a raw-track label under e.g. `drum set` they change nothing.
    high hat: {reason: "cymbals scored on OpenMIC only (taxonomy 3.0.0)", stem_unknown: [drums, percussion]}
    cymbal: {reason: "cymbals scored on OpenMIC only (taxonomy 3.0.0)", stem_unknown: [drums, percussion]}

# ------------------------------------------------------------------------ Slakh2100
# Primary key = basename(plugin_name): the Kontakt patch that actually rendered the audio.
# Slakh picks a random patch from a program GROUP (slakh-generation
# instr_defs_metadata/komplete_strict.json), so the MIDI program number is NOT a reliable
# fine label (real metadata: program 22 "Harmonica" rendered by transistor_compact.nkm, an
# organ; program 33 "finger" bass rendered by a palm-muted Rickenbacker patch).
# `inst_class` (GM family) is the fallback when a patch is not in `plugins`; the loader
# surfaces the unknown patch either way.
slakh:
  unobserved:
    # Bradley 2026-09-28: cymbals are scored only on OpenMIC. Slakh has no cymbal label at
    # all (only whole-kit patches), so the v2 "kit implies cymbals" rule is dropped.
    cymbals: "scored only on OpenMIC (taxonomy 3.0.0)"
  plugins:
    # Acoustic Piano group
    ragtime_piano.nkm: keys.piano
    the_giant_hard_and_tough.nkm: keys.piano
    the_giant_modern_studio.nkm: keys.piano
    the_giant_vibrant.nkm: keys.piano
    alicias_keys.nkm: keys.piano
    the_grandeur.nkm: keys.piano
    the_gentleman.nkm: keys.piano
    grand_piano.nkm: keys.piano
    upright_piano.nkm: keys.piano
    concert_grand.nkm: keys.piano
    august_foerster_grand.nkm: keys.piano
    harpsichord.nkm: keys.harpsichord
    # Electric Piano group
