  - id: woodwinds.flute
    name: Flute / piccolo
    data: [medleydb, openmic, slakh]
  - id: woodwinds.oboe
    name: Oboe / English horn
    data: [medleydb, slakh]
  - id: woodwinds.bassoon
    name: Bassoon
    data: [medleydb, slakh]
  - id: woodwinds.harmonica
    name: Harmonica
    data: [medleydb]
    planned: [golden]      # no test positives in medleydb_split_v1
