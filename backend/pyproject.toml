[project]
name = "disstruments"
version = "0.1.0"
description = "Song deconstruction: stems, instruments, key/BPM in one report"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Real ML stages. Not needed when DISS_FAKE_ML=1 (dev/tests).
ml = [
    "torch>=2.3",
    "demucs>=4.0.1",
    "panns-inference>=0.1.1",
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["disstruments"]
