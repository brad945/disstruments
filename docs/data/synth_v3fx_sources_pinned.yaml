# M2 S0 source registry (docs/M2_PLAN.md §2 S0, §4, §5). Loaded/validated by sources.py.
# Every source maps to the taxonomy leaves it *truly is*; licences re-read on the download
# page on 2026-10-07. Archives were sha256-hashed at download, extracted under `root`, then
# deleted (re-fetch from `download.url` and compare sha256 to reproduce). Git sparse
# checkouts have no archive: they pin `download.commit` (also in <dir>/.commit; .git removed), sha256: null.
# Engines (Surge XT, Dexed, sfizz, fluidsynth) are installed separately; synth sources render
# with OUR OWN / procedurally randomized patches (M2_PLAN D8).
version: 1
root: ~/datasets/disstruments-synth/sources   # relative paths below resolve here
v1_leaves:
  - guitar.acoustic.nylon
  - guitar.acoustic.steel
  - guitar.electric.clean
  - guitar.electric.distorted
  - bass.electric.picked
  - bass.electric.fingered
  - bass.upright
  - bass.synth.analog
  - bass.synth.sub_808
  - keys.piano
  - keys.electric_piano.rhodes
  - keys.electric_piano.fm
  - keys.organ.drawbar
  - keys.synth.pad
  - keys.synth.lead
  - keys.synth.pluck
  - drums.acoustic_kit
  - drums.electronic.tr808
  - woodwinds.saxophone.tenor
  - brass.trumpet

sources:
  # ------------------------------------------------------------------ synth engines
  - id: surge_xt
    name: Surge XT (own patches)
    kind: synth
    engine: surge_xt
    leaves: [bass.synth.analog, bass.synth.sub_808, keys.synth.pad, keys.synth.lead,
             keys.synth.pluck]
    license: LicenseRef-engine-output
    license_url: https://surge-synthesizer.github.io/faq/
    commercial_clean: true
    attribution: ""
    notes: "GPL-3.0 engine; FAQ: 'The output of Surge XT is yours' (incl. factory presets). Own/randomized patches per D8; tr808 is rendered by drum808_numpy instead."

  - id: drum808_numpy
    name: TR-808-style drum synth (ours, numpy)
    kind: synth
    engine: drum808
    leaves: [drums.electronic.tr808]
    license: LicenseRef-engine-output
    commercial_clean: true
    attribution: ""
    notes: "Our own code (ml/synth/drum808.py): 808-topology voices, no samples; kit params recorded per clip."

  - id: dexed
    name: Dexed DX7 emulation (own patches)
    kind: synth
    engine: dexed
    leaves: []   # disabled 2026-10-07: Bradley's audit (FM recipe sounds like wind chimes)
    license: LicenseRef-engine-output
    license_url: https://github.com/asb2m10/dexed/blob/master/LICENSE
    commercial_clean: true
    attribution: ""
    notes: "GPL-3.0 engine (msfa core Apache-2.0); output not covered by GPL. rhodes = FM-MODELLED (D5 ablation: does synth-Rhodes generalize to real Rhodes?). No third-party cartridges."

